version: '3.8'

services:
  frontend:
    build:
      context: ./frontend/ktbv2
      dockerfile: Dockerfile
    container_name: frontend_container
    ports:
      - "80:80"      # Standard HTTP port
      - "5173:80"    # Compatibility port for existing bookmarks
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./backend/ktbv2
      dockerfile: Dockerfile
    container_name: backend_container
    ports:
      - "8000:8000"  # Expose Django directly if needed
    volumes:
      - ./backend/ktbv2:/app
      - media_data:/app/media
    environment:
      - DB_NAME=${DB_NAME:-ktbv2_db}
      - DB_USER=${DB_USER:-ktbv2_user}
      - DB_PASSWORD=${DB_PASSWORD:-admin123}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis_container
    restart: unless-stopped
    volumes:
      - redis_data:/data

  celery_worker:
    build:
      context: ./backend/ktbv2
      dockerfile: Dockerfile
    container_name: celery_worker_container
    command: celery -A ktbv2 worker -l info --concurrency=4 -O fair
    volumes:
      - ./backend/ktbv2:/app
      - media_data:/app/media
    environment:
      - DB_NAME=${DB_NAME:-ktbv2_db}
      - DB_USER=${DB_USER:-ktbv2_user}
      - DB_PASSWORD=${DB_PASSWORD:-admin123}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - redis
      - backend

volumes:
  redis_data:
  media_data: